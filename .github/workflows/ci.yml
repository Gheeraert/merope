name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Pandoc, Xvfb, and Qt EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc xvfb libegl1
      - name: Verify Pandoc
        run: pandoc --version
      - name: Install project
        run: python -m pip install -e ".[dev,qt_editor]"
      - name: Run tests
        run: xvfb-run -a python -m pytest -q

  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Pandoc
        run: choco install pandoc --no-progress -y
      - name: Verify Pandoc
        run: pandoc --version
      - name: Install project
        run: python -m pip install -e ".[dev,qt_editor]"
      - name: Run tests
        run: python -m pytest -q
